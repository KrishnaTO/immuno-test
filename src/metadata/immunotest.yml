# PURL configuration for http://purl.obolibrary.org/obo/immunotest

idspace: IMMUNOTEST
base_url: /obo/immunotest

products:
- immunotest.owl: https://raw.githubusercontent.com/krishnaTO/immuno-test/main/immunotest.owl
- immunotest.obo: https://raw.githubusercontent.com/krishnaTO/immuno-test/main/immunotest.obo

term_browser: ontobee
example_terms:
- IMMUNOTEST_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/krishnaTO/immuno-test/v

- prefix: /tracker/
  replacement: https://github.com/krishnaTO/immuno-test/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/IMMUNOTEST?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/krishnaTO/immuno-test/main/
